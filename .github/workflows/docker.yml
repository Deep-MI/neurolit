name: docker
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and push (e.g. v0.7.1)'
        required: true

jobs:
  dockerhub:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check tag matches package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "v${version}" != "${RELEASE_TAG}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match pyproject.toml version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Free disk space
        # The image (FastSurfer GPU base, CUDA torch, model weights) does not fit on a default runner.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: ./containerization/build_docker.sh -t "deepmi/lit:${VERSION}"
      - name: Smoke test image
        run: docker run --rm "deepmi/lit:${VERSION}" --help
      - name: Push image
        run: docker push "deepmi/lit:${VERSION}"
