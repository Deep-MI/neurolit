name: pytest
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - '**.py'
      - 'neurolit/postprocessing/**.json'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'neurolit/postprocessing/**.json'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: ubuntu
            python-version: "3.14"
    name: ${{ matrix.os }} - py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --progress-bar off --upgrade pip setuptools wheel
          python -m pip install --progress-bar off .[test]
      - name: Run pytest
        run: pytest neurolit
      - name: Checkout FastSurfer release for integration test
        if: matrix.os == 'ubuntu' && matrix.python-version == '3.14'
        uses: actions/checkout@v6
        with:
          repository: Deep-MI/FastSurfer
          ref: v2.6.0
          path: .fastsurfer-test
      - name: Check FastSurfer segmentation statistics and rerun backups
        if: matrix.os == 'ubuntu' && matrix.python-version == '3.14'
        env:
          NEUROLIT_TEST_FASTSURFER: ${{ github.workspace }}/.fastsurfer-test
        run: pytest neurolit/tests/test_fastsurfer_integration.py
